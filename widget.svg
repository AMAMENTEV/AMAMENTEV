<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
    
    .bg { fill: #0d1117; }
    .particle {
      animation: float 4s ease-in-out infinite alternate;
    }
    
    /* Создаем хаотичное движение частиц для разных групп */
    @keyframes float {
      0% { transform: translate(0, 0); opacity: 0.9; }
      50% { opacity: 0.4; }
      100% { transform: translate(var(--mx, 3px), var(--my, -5px)); opacity: 1; }
    }
    
    /* Разные сдвиги для эффекта распада */
    .p1 { --mx: 5px;  --my: -8px;  animation-delay: 0.2s; }
    .p2 { --mx: -6px; --my: 4px;   animation-delay: 0.5s; }
    .p3 { --mx: 8px;  --my: 6px;   animation-delay: 0.8s; }
    .p4 { --mx: -4px; --my: -7px;  animation-delay: 1.1s; }
    .p5 { --mx: 10px; --my: -2px;  animation-delay: 1.4s; }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <g fill="#c9d1d9">
    <rect x="160" y="90" width="4" height="4" class="particle p1" />
    <rect x="160" y="110" width="4" height="4" class="particle p3" />
    <rect x="180" y="90" width="4" height="4" class="particle p2" />
    <rect x="180" y="110" width="4" height="4" class="particle p5" />
    <rect x="210" y="90" width="4" height="4" class="particle p4" />
    <rect x="220" y="100" width="4" height="4" class="particle p1" />
    <rect x="230" y="90" width="4" height="4" class="particle p3" />
    <rect x="260" y="90" width="4" height="4" class="particle p2" />
    <rect x="270" y="100" width="4" height="4" class="particle p5" />
    <rect x="280" y="110" width="4" height="4" class="particle p1" />
    <rect x="310" y="90" width="4" height="4" class="particle p4" />
    <rect x="320" y="95" width="4" height="4" class="particle p3" />
    <rect x="320" y="110" width="4" height="4" class="particle p2" />
    <rect x="350" y="90" width="4" height="4" class="particle p1" />
    <rect x="360" y="100" width="4" height="4" class="particle p5" />
    <rect x="370" y="110" width="4" height="4" class="particle p4" />
    <rect x="400" y="110" width="4" height="4" class="particle p3" />
    <rect x="405" y="90" width="4" height="4" class="particle p2" />
    <rect x="410" y="110" width="4" height="4" class="particle p1" />
    
    <rect x="190" y="85" width="5" height="5" fill="#ff7b72" class="particle p5" />
    <rect x="330" y="115" width="5" height="5" fill="#ff7b72" class="particle p2" />
    <rect x="490" y="120" width="6" height="6" fill="#ff7b72" class="particle p4" />
    
    <rect x="460" y="90" width="6" height="6" class="particle p1" />
    <rect x="460" y="105" width="6" height="6" class="particle p3" />
    <rect x="475" y="105" width="6" height="6" class="particle p2" />
    
    <rect x="510" y="90" width="6" height="6" class="particle p4" />
    <rect x="510" y="110" width="6" height="6" class="particle p5" />
    <rect x="525" y="100" width="6" height="6" class="particle p1" />
    
    <rect x="560" y="90" width="6" height="6" class="particle p2" />
    <rect x="560" y="105" width="6" height="6" class="particle p3" />
    <rect x="575" y="105" width="6" height="6" class="particle p4" />
  </g>

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="'Inter', sans-serif" font-size="75" font-weight="700" fill="#f0f6fc" opacity="0.95">ОШИБКА 404</text>
</svg>
